name: E2E Web (nightly)

on:
  schedule:
    # 07:30 UTC daily
    - cron: '30 7 * * *'
  workflow_dispatch:

# Non-blocking by nature: scheduled workflow, not wired into branch protection.
# Failures surface in the Actions tab and notification emails only.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: festie_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9
          run_install: false

      - name: Install root deps
        run: npm ci

      - name: Install workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=test_password psql -h localhost -U test_user -d festie_test -f "$migration"
          done

      - name: Build web frontend
        working-directory: packages
        run: pnpm --filter @festie/web build

      - name: Start server in background
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          MAX_USERS: '10000'
          PORT: '3000'
        run: npm start &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/ready && break
            echo "Waiting for server... attempt $i"
            sleep 2
          done

      # Functional E2E only. The visual-regression specs (toHaveScreenshot) need
      # committed baseline snapshots + a deliberate update workflow — they can't
      # pass on a fresh headless runner (no baseline, font/AA drift), so they are
      # NOT part of the functional nightly. The festival-planner suite is currently
      # quarantined (.fixme) pending its React-SPA migration; responsive-design runs
      # when the FESTIE_TEST_* secrets are present and skips cleanly otherwise.
      - name: Run Playwright E2E (functional, chromium)
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          FESTIE_TEST_USER: ${{ secrets.TEST_USERNAME }}
          FESTIE_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        # --grep-invert screenshot skips the toHaveScreenshot visual-regression
        # tests inside responsive-design (cards/timeline-view snapshots) — they
        # need committed baselines like the dedicated visual-regression specs and
        # can't pass on a fresh runner. The functional layout/overflow/a11y
        # assertions still run.
        run: >-
          npx playwright test --project=chromium --grep-invert screenshot
          tests/e2e/festival-planner.spec.ts
          tests/e2e/responsive-design.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
