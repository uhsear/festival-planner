name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

# Opt every JS action into the Node 24 runtime ahead of GitHub's 2026-06-16
# forced migration. This silences the Node 20 deprecation across all actions
# (including pnpm/action-setup@v4, whose `version:` input we keep — the root
# must not carry a packageManager field). checkout/setup-node are also bumped
# to their Node 24 majors below.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: zricethezav/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - run: npm ci
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - run: npm run lint
      - name: Lint frontend (packages/web)
        working-directory: packages
        run: pnpm --filter @festie/web lint
      - name: Lint shared (packages/shared)
        working-directory: packages
        run: pnpm --filter @festie/shared lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: festie_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: packages
        run: pnpm --filter @festie/web build
      - name: Set up database
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=test_password psql -h localhost -U test_user -d festie_test -f "$migration"
          done
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          MAX_USERS: '10000'
        run: npm run test:coverage
      - name: Enforce coverage threshold (80% minimum)
        run: npx c8 check-coverage --lines 80 --branches 60 --functions 60 --statements 80
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Test shared (vitest)
        working-directory: packages
        run: pnpm --filter @festie/shared test
      - name: Test web (vitest)
        working-directory: packages
        run: pnpm --filter @festie/web test

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck (packages/mobile)
        working-directory: packages
        run: pnpm --filter @festie/mobile typecheck
      - name: Lint (packages/mobile)
        working-directory: packages
        run: pnpm --filter @festie/mobile lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Audit frontend (pnpm, prod deps)
        working-directory: packages
        # Advisory for now (won't block) — surfaces the React/Expo/RN graph that
        # `npm audit` (backend-only) never reached. --prod skips dev-only deprecations.
        run: pnpm audit --prod --audit-level=high || true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          # Query from packages/ (the real workspace); the root pnpm-workspace.yaml
          # has no `packages:` field, so `pnpm store path` errors there. Swallow any
          # error and fall back to the default store dir so the cache always has a path.
          STORE_PATH="$(cd packages && pnpm store path --silent 2>/dev/null || true)"
          if [ -z "$STORE_PATH" ]; then STORE_PATH="$HOME/.local/share/pnpm/store"; fi
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - run: npm ci
      - name: Typecheck (backend)
        run: npm run typecheck
      - name: Typecheck (packages/web)
        working-directory: packages
        run: pnpm --filter @festie/web typecheck
      - name: Typecheck (packages/shared)
        working-directory: packages
        run: pnpm --filter @festie/shared typecheck
      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
      - name: Semgrep scan (React + OWASP Top Ten)
        run: pipx run semgrep scan --config=p/react --config=p/owasp-top-ten --error packages/

  lighthouse:
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: packages
        run: pnpm --filter @festie/web build
      - name: Run Lighthouse CI
        working-directory: packages/web
        run: pnpm exec lhci autorun --config=.lighthouserc.cjs

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: packages
        run: pnpm --filter @festie/web build
      - name: Check bundle size
        continue-on-error: true
        working-directory: packages/web
        run: pnpm exec bundlemon

  docker:
    needs: [test, frontend-tests, mobile-typecheck]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          tags: festie:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
