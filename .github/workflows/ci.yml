name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

# Cancel superseded runs on the same ref so only the latest push to a branch/PR
# holds runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt every JS action into the Node 24 runtime ahead of GitHub's 2026-06-16
# forced migration. This silences the Node 20 deprecation across all actions
# (including pnpm/action-setup@v4, whose `version:` input we keep — the root
# must not carry a packageManager field). checkout/setup-node are also bumped
# to their Node 24 majors below.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # Path filtering (P8): gate the web and mobile jobs on whether their files
  # changed. dorny/paths-filter compares against the PR base (or the previous
  # push) and exposes one boolean output per filter. Backend jobs (lint, test,
  # security, quality) run unconditionally.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'packages/pnpm-lock.yaml'
              - 'packages/package.json'
            mobile:
              - 'packages/mobile/**'
              - 'packages/shared/**'
              - 'packages/pnpm-lock.yaml'
              - 'packages/package.json'

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: zricethezav/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
        with:
          node-cache: 'npm'
      - run: npm ci
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - run: npm run lint
      - name: Lint frontend (packages/web)
        working-directory: packages
        run: pnpm --filter @festie/web lint
      - name: Lint shared (packages/shared)
        working-directory: packages
        run: pnpm --filter @festie/shared lint
      - name: Dependency boundaries (dependency-cruiser)
        run: npm run depcruise
      - name: Dead-code report (knip, non-blocking)
        run: npm run knip
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: festie_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ matrix.node-version }}
          node-cache: 'npm'
      - run: npm ci
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: packages
        run: pnpm --filter @festie/web build
      - name: Upload web build (shared by lighthouse + bundle-size)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1
      - name: Set up database
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=test_password psql -h localhost -U test_user -d festie_test -f "$migration"
          done
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          MAX_USERS: '10000'
        run: npm run test:coverage
      - name: Enforce coverage threshold (80% minimum)
        run: npx c8 check-coverage --lines 80 --branches 60 --functions 60 --statements 80
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Test shared (vitest + coverage)
        working-directory: packages
        env:
          COVERAGE: '1'
        run: pnpm --filter @festie/shared test -- --coverage
      - name: Test web (vitest + coverage)
        working-directory: packages
        env:
          COVERAGE: '1'
        run: pnpm --filter @festie/web test -- --coverage

  storybook-a11y:
    # Runs axe over every Storybook story via @storybook/test-runner and fails on
    # serious/critical WCAG violations (see packages/web/.storybook/test-runner.ts).
    # The addon-a11y already surfaces these in the Storybook UI; this makes a PR
    # actually fail on them. Web/shared-gated (P8); not a required check yet.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium (test-runner engine)
        working-directory: packages/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Storybook
        working-directory: packages/web
        run: pnpm build-storybook --quiet
      - name: Storybook a11y scan (axe — serious/critical fail the run)
        working-directory: packages/web
        env:
          STORYBOOK_TELEMETRY_DISABLED: '1'
        run: pnpm test-storybook:ci

  mobile-typecheck:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck (packages/mobile)
        working-directory: packages
        run: pnpm --filter @festie/mobile typecheck
      - name: Lint (packages/mobile)
        working-directory: packages
        run: pnpm --filter @festie/mobile lint

  mobile-tests:
    # Mirrors frontend-tests: path-gated on packages/mobile or packages/shared
    # changes (same filter the changes job exposes as `mobile`). Pass/fail only
    # — no coverage threshold enforced here (jest config owned separately).
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
      - name: Install workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Test mobile (jest-expo)
        working-directory: packages
        run: pnpm --filter @festie/mobile test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
        with:
          node-cache: 'npm'
      - run: npm ci
      - name: Lockfile integrity (blocking)
        # The pnpm side already refuses exotic subdeps and downgrades via
        # blockExoticSubdeps + trustPolicy in packages/pnpm-workspace.yaml; the npm
        # root had no equivalent, so a lockfile entry silently repointed at a
        # non-npm host would have gone unnoticed. Blocking on purpose: unlike a
        # fresh CVE advisory, a resolved URL leaving the registry is never routine.
        # Verified locally 2026-08-18 against the current lockfile: "No issues detected".
        run: npx --yes lockfile-lint@4 --path package-lock.json --validate-https --allowed-hosts npm
      - name: npm audit (advisory — non-blocking)
        # Advisory only: the blocking owner of this check is security-audit.yml
        # (daily cron). Keeping it non-fatal here stops a fresh advisory from
        # wedging the push path red. The `echo` makes the outcome visible in logs.
        run: npm audit --audit-level=high || echo "::warning::npm audit found high+ advisories — see the security-audit workflow for the blocking check"
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Audit frontend (pnpm, prod deps)
        working-directory: packages
        # Advisory for now (won't block) — surfaces the React/Expo/RN graph that
        # `npm audit` (backend-only) never reached. --prod skips dev-only deprecations.
        run: pnpm audit --prod --audit-level=high || true

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history so `git show origin/main:...` is available for the
          # oasdiff base-spec comparison below.
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-setup
        with:
          node-cache: 'npm'
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - run: npm ci
      - name: Cross-workspace version parity (syncpack)
        run: npx syncpack lint

      # ── API schema drift gate ────────────────────────────────────────────────
      # Save the committed spec BEFORE regenerating so oasdiff can compare the
      # base-branch (main) spec versus the spec produced by this branch's Zod schemas.
      - name: Save base-branch OpenAPI spec for oasdiff
        run: |
          # Try origin/main first; fall back to HEAD~1 on direct pushes to main.
          if git show origin/main:lib/openapi.generated.json > /tmp/base-openapi.json 2>/dev/null; then
            echo "BASE_SPEC=/tmp/base-openapi.json" >> "$GITHUB_ENV"
            echo "Base spec sourced from origin/main"
          elif git show HEAD~1:lib/openapi.generated.json > /tmp/base-openapi.json 2>/dev/null; then
            echo "BASE_SPEC=/tmp/base-openapi.json" >> "$GITHUB_ENV"
            echo "Base spec sourced from HEAD~1 (direct push to main)"
          else
            echo "BASE_SPEC=" >> "$GITHUB_ENV"
            echo "::warning::No base spec found; oasdiff comparison will be skipped"
          fi

      - name: Regenerate OpenAPI spec + shared types
        # Derives lib/openapi.generated.json and packages/shared/src/types/api.gen.ts
        # directly from the Zod schemas (lib/schemas.ts via lib/openapi.ts).
        run: npm run gen:api-types

      - name: Drift gate — generated artifacts must match what is committed
        # BLOCKING. If a developer edits a Zod schema in lib/schemas.ts without
        # running `npm run gen:api-types` and committing the result, this step fails
        # with a clear diff. The two source-of-truth files:
        #   lib/openapi.generated.json          (the spec snapshot)
        #   packages/shared/src/types/api.gen.ts (shared TS types for web + mobile)
        run: |
          git diff --exit-code -- lib/openapi.generated.json packages/shared/src/types/api.gen.ts || {
            echo ""
            echo "::error::OpenAPI spec / shared types are out of date."
            echo "::error::Run \`npm run gen:api-types\` locally and commit the two generated files:"
            echo "::error::  lib/openapi.generated.json"
            echo "::error::  packages/shared/src/types/api.gen.ts"
            exit 1
          }

      - name: Install oasdiff (breaking-change detector)
        # oasdiff is a Go binary; ubuntu-latest ships with Go. Non-blocking: oasdiff
        # is a nice-to-have warn gate, so a flaky `go install` must never fail CI
        # (the diff step below already guards a missing binary).
        continue-on-error: true
        run: go install github.com/tufin/oasdiff@latest

      - name: oasdiff — detect breaking API changes (non-blocking warn)
        # Compares the base-branch committed spec (origin/main) versus the spec
        # generated from this branch's Zod schemas.  Non-blocking: a breaking
        # change surfaces as a workflow warning and is visible in the PR log, but
        # it does NOT fail CI — the team decides intentional breaks are acceptable.
        # Promote to blocking by removing `|| true` and dropping `continue-on-error`.
        continue-on-error: true
        run: |
          if [ -z "$BASE_SPEC" ]; then
            echo "::warning::oasdiff skipped — no base spec available"
            exit 0
          fi
          BREAK_OUTPUT=$(~/go/bin/oasdiff breaking "$BASE_SPEC" lib/openapi.generated.json 2>&1 || true)
          if [ -n "$BREAK_OUTPUT" ]; then
            echo "::warning::oasdiff detected breaking API changes vs origin/main:"
            echo "$BREAK_OUTPUT" | while IFS= read -r line; do
              echo "::warning::  $line"
            done
          else
            echo "oasdiff: no breaking changes detected vs origin/main"
          fi
      # ── End API schema drift gate ────────────────────────────────────────────

      - name: Typecheck (backend)
        run: npm run typecheck
      - name: Typecheck (packages/web)
        working-directory: packages
        run: pnpm --filter @festie/web typecheck
      - name: Typecheck (packages/shared)
        working-directory: packages
        run: pnpm --filter @festie/shared typecheck
      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
      - name: Semgrep scan (React + OWASP Top Ten)
        # Pinned for determinism + faster, cached resolution (P9).
        run: pipx run semgrep==1.166.0 scan --config=p/react --config=p/owasp-top-ten --error packages/

  lighthouse:
    # Reuses the web build from `test` (P5) and only runs when the web/shared
    # surface changed (P8).
    needs: [changes, test, quality]
    if: |
      needs.changes.outputs.web == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: packages/web/dist
      - name: Run Lighthouse CI
        working-directory: packages/web
        run: pnpm exec lhci autorun --config=.lighthouserc.cjs

  bundle-size:
    # Reuses the web build from `test` (P5); only runs on web/shared changes (P8).
    needs: [changes, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-setup
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: packages/web/dist
      - name: Check bundle size
        continue-on-error: true
        working-directory: packages/web
        run: pnpm exec bundlemon

  docker:
    needs: [test, frontend-tests, mobile-typecheck, mobile-tests]
    # frontend-tests / mobile-typecheck / mobile-tests may be path-filtered out
    # (P8). `always()` plus explicit result checks lets docker proceed when an
    # upstream job is *skipped*, while still gating on real failures/cancellations.
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      always() &&
      needs.test.result == 'success' &&
      needs.frontend-tests.result != 'failure' && needs.frontend-tests.result != 'cancelled' &&
      needs.mobile-typecheck.result != 'failure' && needs.mobile-typecheck.result != 'cancelled' &&
      needs.mobile-tests.result != 'failure' && needs.mobile-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: festie:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
