name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - run: npm ci
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - run: npm run lint
      - run: npm run lint:check
      - name: Lint frontend (packages/web)
        working-directory: packages
        run: pnpm --filter @festie/web lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: festival_planner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: packages
        run: pnpm --filter @festie/web build
      - name: Set up database
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festival_planner_test
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=test_password psql -h localhost -U test_user -d festival_planner_test -f "$migration"
          done
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festival_planner_test
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festival_planner_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck (packages/web)
        working-directory: packages
        run: pnpm --filter @festie/web typecheck
      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
      - name: Semgrep scan (React + OWASP Top Ten)
        run: pipx run semgrep scan --config=p/react --config=p/owasp-top-ten --error packages/

  lighthouse:
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install web workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile
      - name: Run Lighthouse CI
        working-directory: packages/web
        run: pnpm exec lhci autorun --config=.lighthouserc.cjs

  docker:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: festival-planner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
