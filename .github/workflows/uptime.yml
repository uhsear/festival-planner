name: Uptime Monitor

"on":
  schedule:
    # Every 10 minutes. GitHub Actions schedules may run a few minutes late
    # under high load; this is acceptable for an uptime monitor.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Match ci.yml: opt JS actions into the Node 24 runtime ahead of GitHub's
# 2026-06-16 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Health check — festie.us
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check homepage (HTTP 200)
        # -f  → fail on HTTP 4xx/5xx (exit 22)
        # -s  → silent (no progress bar)
        # -S  → show errors even in silent mode
        # --max-time 15   → hard wall-clock timeout per attempt
        # --retry 2       → two automatic retries on transient failures
        # --retry-delay 5 → 5-second gap between retries
        run: |
          curl -fsS \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            https://festie.us/

      - name: Check /api/ready (HTTP 200 + JSON status=ready + db/redis=ok)
        run: |
          body=$(curl -fsS \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            https://festie.us/api/ready)

          echo "Response: $body"

          # The API wraps everything in a {data:{...},error:null} envelope:
          #   {"data":{"status":"ready","checks":{"database":"ok","redis":"ok"}},...}
          # so status is at data.status and db/redis at data.checks.*.
          status=$(echo "$body" | python3 -c "import sys,json; print((json.load(sys.stdin).get('data') or {}).get('status',''))")
          if [ "$status" != "ready" ]; then
            echo "ERROR: status='$status', expected 'ready'"
            exit 1
          fi

          db=$(echo "$body" | python3 -c "import sys,json; print(((json.load(sys.stdin).get('data') or {}).get('checks') or {}).get('database',''))")
          if [ "$db" != "ok" ]; then
            echo "ERROR: database='$db', expected 'ok'"
            exit 1
          fi

          redis=$(echo "$body" | python3 -c "import sys,json; print(((json.load(sys.stdin).get('data') or {}).get('checks') or {}).get('redis',''))")
          if [ "$redis" != "ok" ]; then
            echo "ERROR: redis='$redis', expected 'ok'"
            exit 1
          fi

          echo "All checks passed: status=$status database=$db redis=$redis"

      # ── Alert management ─────────────────────────────────────────────────
      # On SUCCESS: close any open "festie.us DOWN" issue.
      # The health steps above must both pass before we reach this step.
      - name: Close any open DOWN issue (site is healthy)
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'festie.us DOWN';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime-alert',
              per_page: 10,
            });
            const downIssues = issues.filter(i => i.title === title);
            for (const issue of downIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **festie.us is back up** — health check passed at ${new Date().toUTCString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`Closed issue #${issue.number}`);
            }

      # On FAILURE: open a new issue or add a comment to the existing one.
      # `if: failure()` runs only when a previous step failed; the issue logic
      # itself runs in a separate JS context so it cannot mask the job failure —
      # the job still exits red via the earlier step.
      - name: Open or update DOWN issue (site is unhealthy)
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'festie.us DOWN';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toUTCString();

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime-alert',
              per_page: 10,
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              // Already open — add a comment so the timeline shows ongoing outage.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ **Still down** — check failed again at ${now}.\n\n[Run details](${runUrl})`,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              // First failure — open a new issue.
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['uptime-alert'],
                body: [
                  '## festie.us is DOWN',
                  '',
                  `Health check failed at **${now}**.`,
                  '',
                  `[View failing run](${runUrl})`,
                  '',
                  '**Checks performed:**',
                  '- `GET https://festie.us/` — expected HTTP 200',
                  '- `GET https://festie.us/api/ready` — expected `status=ready`, `database=ok`, `redis=ok`',
                  '',
                  '_This issue will be closed automatically when the next check passes._',
                ].join('\n'),
              });
              core.info(`Opened new issue #${newIssue.number}`);
            }
