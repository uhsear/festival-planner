name: Android E2E

# Free, EAS-credit-free Android end-to-end smoke.
#
# GitHub-hosted ubuntu-latest runners now expose /dev/kvm, so a hardware-
# accelerated Android emulator runs in CI at no cost on a public repo. This job
# builds a *local Gradle release APK* (no EAS build) and drives it with Maestro on
# the emulator — the same harness used locally ([[maestro_verify]]), giving us
# Android UI validation without spending an EAS build.
#
# Manual-only by design (it's a ~25min build+emulator job; we don't want it on
# every push). Run it from the Actions tab, or:
#   gh workflow run android-e2e.yml --ref <branch>
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPO_NO_TELEMETRY: '1'
  # Debug builds shouldn't upload to Sentry; keep the Gradle plugin from trying.
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

permissions:
  contents: read
  # Required by dorny/test-reporter to post JUnit check annotations on the run.
  checks: write
  actions: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ── Disk reclaim ─────────────────────────────────────────────────────────
      # ubuntu-latest ships ~14 GB of tools we never need.  Delete them before
      # any deps are fetched so the space is available for the Gradle + emulator
      # image (~10–12 GB together).  We keep the Android SDK (used below) and
      # only touch the known space-hogs: dotnet (~3 GB), ghc (~3 GB), CodeQL
      # (~2 GB), swap file (~4 GB).
      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules/npm  # replaced by setup-node below
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Free the default 4 GB swap file — emulator uses RAM, not swap
          sudo swapoff -a && sudo rm -f /swapfile || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require smoke-test credentials
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          test -n "$TEST_USERNAME" || { echo "::error::TEST_USERNAME is not configured"; exit 1; }
          test -n "$TEST_PASSWORD" || { echo "::error::TEST_PASSWORD is not configured"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # RN 0.85 / Expo SDK 56 build with AGP 8 -> still JDK 17 (RN docs warn
      # against higher JDKs; do NOT bump to 21).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle` here: android/ is gitignored and only generated by
          # the prebuild step below, so there are no *.gradle files at checkout for
          # setup-java to key a cache on (it hard-fails). Single-ABI build keeps
          # the time reasonable without caching.

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          run_install: false

      # ── Caches ───────────────────────────────────────────────────────────────
      - name: Get pnpm store path
        id: pnpm-store-path
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store-path.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Gradle caches (~/.gradle/caches + ~/.gradle/wrapper) are keyed on
      # pnpm-lock.yaml because the android/ project is generated by prebuild
      # (gitignored), so there are no committed *.gradle files to hash.
      - name: Cache Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install workspace deps (pnpm)
        working-directory: packages
        run: pnpm install --frozen-lockfile

      # Generate the native android/ project (CNG; android/ is gitignored).
      # --no-install: pnpm already installed node_modules; don't let prebuild
      # shell out to npm and fight the pnpm layout.
      - name: Expo prebuild (android)
        working-directory: packages/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # RN 0.85's template targets compileSdk/targetSdk 36 (Android 16) +
      # build-tools 36.0.0, which the ubuntu-latest image may not preinstall yet.
      # AGP does not reliably auto-download SDK platforms, so install them
      # explicitly or gradle fails at configuration time. (|| true: harmless if
      # the runner already has them.)
      - name: Ensure Android SDK 36 (RN 0.85 compileSdk)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      # The New-Arch release build exhausts Expo's default Gradle Metaspace and
      # dies with OutOfMemoryError: Metaspace. The properties file's last value
      # wins, so appending overrides it. Runner has ~7GB; leave room for the
      # native (clang/CMake) compilers that run outside the JVM. RN 0.85's
      # heavier New-Arch/C++20 codegen needs more Metaspace -- set -XX:MaxMetaspaceSize=768m.
      - name: Raise Gradle JVM memory
        working-directory: packages/mobile/android
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8\n' >> gradle.properties

      # Release (not debug): a debug APK expects a Metro dev server to serve the
      # JS bundle at runtime, which CI has none of — the app would launch to a
      # blank screen. The release variant embeds the Hermes bundle so it's fully
      # self-contained, and Expo's prebuild template signs release with the debug
      # keystore by default, so no signing secret is needed (emulator-installable).
      # Limit native compilation to the emulator's ABI (x86_64). Release mode
      # compiles native C++ (reanimated/worklets/svg/...) with optimizations, and
      # doing it for all four ABIs (arm + x86) blew the job timeout — one ABI is
      # ~4x faster and the emulator is x86_64.
      # -x lintVitalRelease: skip the release fatal-lint pass — it's memory-heavy,
      # slow, and irrelevant to an E2E smoke (and was failing under the OOM).
      - name: Build self-contained APK (x86_64)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64 -x lintVitalRelease

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.6.1
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # GitHub-hosted runners ship KVM but the device node isn't group-writable
      # by default; this udev rule makes the emulator hardware-accelerated.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── AVD snapshot cache ────────────────────────────────────────────────────
      # reactivecircus/android-emulator-runner@v2 will skip AVD creation when it
      # finds an AVD named $avd-name already in ~/.android/avd/.  We cache that
      # directory so cold-boot (~3 min) only happens on cache miss.
      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # api34: the API-33 google_apis image needs ~9.8 GB for its userdata
          # partition but only ~8 GB is free on the disk-reclaimed runner, so it
          # FATALs before boot (upstream issue #455 — 26–32 and 34–35 are fine,
          # 33 fails always). v2 also invalidates any poisoned/half-created AVD
          # cached by the earlier failing API-33 runs (the key is otherwise static).
          key: avd-api34-google_apis-x86_64-v2

      - name: Create AVD (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # api-level 34 (not 33): the API-33 google_apis image's userdata
          # partition needs ~9.8 GB and only ~8 GB is free after the disk
          # reclaim + Gradle build, so API 33 FATALs before boot and adb never
          # comes up. 34 is the known-good level on ubuntu-latest (issue #455).
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: festie-e2e
          ram-size: 4096M
          disable-animations: true
          # -no-snapshot (the action's documented default): always cold-boot
          # cleanly instead of loading/saving a boot snapshot, so a half-written
          # snapshot can't poison later cold boots. AVD creation is still cached.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # 900 s (default is 600): software-GPU cold boot on a busy runner can
          # exceed the 10-min default — give it headroom rather than flake.
          emulator-boot-timeout: 900
          force-avd-creation: false
          script: echo "AVD created and cached."

      - name: Run Maestro smoke on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Required above so the authenticated smoke phase cannot silently skip.
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        with:
          # Must match the Create-AVD step above (api-level/target/arch/options)
          # or the cached AVD won't be reused. See that step for the api-34 +
          # -no-snapshot + boot-timeout rationale.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: festie-e2e
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          ram-size: 4096M
          disable-animations: true
          # Retry logic (max 2 attempts, 1 retry):
          #   - The job flakes when the home-server prod is slow to return the
          #     festival lineup over the public internet; the flow times out but
          #     a re-run passes. A single automatic retry after 20 s cures that
          #     without masking real bugs: a code regression or crash fails
          #     consistently on both attempts, so `exit $MAESTRO_RC` still fails
          #     the job. A ::warning:: annotation makes any retry visible in the
          #     Actions UI so flake patterns are trackable.
          # android-emulator-runner executes each newline as a separate shell
          # command. Keep the loop in a real script so state and `cd` persist.
          script: bash packages/mobile/scripts/run-android-maestro.sh

      - name: Verify route screenshot coverage
        working-directory: packages/mobile
        run: |
          SCREENSHOT_DIR=maestro-debug/screenshots
          COUNT=$(find "$SCREENSHOT_DIR" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l | tr -d ' ')
          UNIQUE=$(find "$SCREENSHOT_DIR" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' -exec sha256sum {} \; | awk '{print $1}' | sort -u | wc -l | tr -d ' ')
          echo "screenshots=$COUNT unique=$UNIQUE"
          test "$COUNT" -ge 21 || { echo "::error::Expected at least 21 route screenshots"; exit 1; }
          test "$UNIQUE" -ge 15 || { echo "::error::Screenshots are not diverse enough; navigation likely stalled"; exit 1; }

      # Maestro records every -e value in commands-*.json and maestro.log.
      # Keep only screenshots in the debug tree so Actions artifacts can never
      # publish the smoke credentials from this public repository.
      - name: Remove credential-bearing Maestro metadata
        if: always()
        working-directory: packages/mobile
        run: |
          if [ -d maestro-debug ]; then
            find maestro-debug -type f ! -path '*/screenshots/*.png' -delete
          fi

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-apk
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Publish the Maestro JUnit report as a PR/run check annotation so failures
      # surface inline. if: always() + continue-on-error: true ensures this step
      # never fails the gate — it is purely informational trend tracking.
      - name: Publish Maestro test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Android Maestro Results
          path: packages/mobile/maestro-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-results
          path: |
            packages/mobile/*.png
            packages/mobile/maestro-report.xml
            packages/mobile/logcat-rn.txt
            packages/mobile/maestro-debug/**
            !packages/mobile/maestro-debug/commands-*.json
            !packages/mobile/maestro-debug/maestro.log
          if-no-files-found: error
