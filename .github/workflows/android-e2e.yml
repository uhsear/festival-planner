name: Android E2E

# Free, EAS-credit-free Android end-to-end smoke.
#
# GitHub-hosted ubuntu-latest runners now expose /dev/kvm, so a hardware-
# accelerated Android emulator runs in CI at no cost on a public repo. This job
# builds a *local Gradle release APK* (no EAS build) and drives it with Maestro on
# the emulator — the same harness used locally ([[maestro_verify]]), giving us
# Android UI validation without spending an EAS build.
#
# Manual-only by design (it's a ~25min build+emulator job; we don't want it on
# every push). Run it from the Actions tab, or:
#   gh workflow run android-e2e.yml --ref <branch>
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPO_NO_TELEMETRY: '1'
  # Debug builds shouldn't upload to Sentry; keep the Gradle plugin from trying.
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # RN 0.85 / Expo SDK 56 build with AGP 8 -> still JDK 17 (RN docs warn
      # against higher JDKs; do NOT bump to 21).
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle` here: android/ is gitignored and only generated by
          # the prebuild step below, so there are no *.gradle files at checkout for
          # setup-java to key a cache on (it hard-fails). Single-ABI build keeps
          # the time reasonable without caching.

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false

      - name: Install workspace deps (pnpm)
        working-directory: packages
        run: pnpm install --frozen-lockfile

      # Generate the native android/ project (CNG; android/ is gitignored).
      # --no-install: pnpm already installed node_modules; don't let prebuild
      # shell out to npm and fight the pnpm layout.
      - name: Expo prebuild (android)
        working-directory: packages/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # RN 0.85's template targets compileSdk/targetSdk 36 (Android 16) +
      # build-tools 36.0.0, which the ubuntu-latest image may not preinstall yet.
      # AGP does not reliably auto-download SDK platforms, so install them
      # explicitly or gradle fails at configuration time. (|| true: harmless if
      # the runner already has them.)
      - name: Ensure Android SDK 36 (RN 0.85 compileSdk)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      # The New-Arch release build exhausts Expo's default Gradle Metaspace and
      # dies with OutOfMemoryError: Metaspace. The properties file's last value
      # wins, so appending overrides it. Runner has ~7GB; leave room for the
      # native (clang/CMake) compilers that run outside the JVM. RN 0.85's
      # heavier New-Arch/C++20 codegen needs more Metaspace than 0.81 did.
      - name: Raise Gradle JVM memory
        working-directory: packages/mobile/android
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8\n' >> gradle.properties

      # Release (not debug): a debug APK expects a Metro dev server to serve the
      # JS bundle at runtime, which CI has none of — the app would launch to a
      # blank screen. The release variant embeds the Hermes bundle so it's fully
      # self-contained, and Expo's prebuild template signs release with the debug
      # keystore by default, so no signing secret is needed (emulator-installable).
      # Limit native compilation to the emulator's ABI (x86_64). Release mode
      # compiles native C++ (reanimated/worklets/svg/...) with optimizations, and
      # doing it for all four ABIs (arm + x86) blew the job timeout — one ABI is
      # ~4x faster and the emulator is x86_64.
      # -x lintVitalRelease: skip the release fatal-lint pass — it's memory-heavy,
      # slow, and irrelevant to an E2E smoke (and was failing under the OOM).
      - name: Build self-contained APK (x86_64)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64 -x lintVitalRelease

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.6.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # GitHub-hosted runners ship KVM but the device node isn't group-writable
      # by default; this udev rule makes the emulator hardware-accelerated.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro smoke on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        env:
          # Passed to Maestro so the authed phase of android-smoke runs; the flow's
          # login is GUARDED, so it stays green even if these are empty.
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # Each script line runs in its own subshell, so a bare `cd` doesn't
          # persist — keep `cd` and `maestro` on one line so the flow path
          # (packages/mobile/.maestro/...) resolves.
          script: |
            adb install -r packages/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            cd packages/mobile && { MAESTRO_CLI_NO_ANALYTICS=1 maestro test -e TEST_USERNAME="$TEST_USERNAME" -e TEST_PASSWORD="$TEST_PASSWORD" --format junit --output maestro-report.xml .maestro/android-smoke.yaml; MAESTRO_RC=$?; adb logcat -d ReactNativeJS:V AndroidRuntime:E ReactNative:W *:S > logcat-rn.txt || true; exit $MAESTRO_RC; }

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-apk
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-maestro-results
          path: |
            packages/mobile/*.png
            packages/mobile/maestro-report.xml
            packages/mobile/logcat-rn.txt
          if-no-files-found: ignore
