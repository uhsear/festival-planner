name: Security Audit

# Scheduled dependency audit. This is the BLOCKING owner of `npm audit` — the CI
# `security` job runs it advisory-only so a new advisory never wedges the push
# path red, while this workflow still surfaces a real, failing signal daily.
on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

# Match ci.yml: opt JS actions into the Node 24 runtime ahead of GitHub's
# 2026-06-16 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (high+ — failing check)
        run: npm audit --audit-level=high
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: pnpm install (workspace)
        run: cd packages && pnpm install --frozen-lockfile
      - name: pnpm audit workspace (high+ — failing check)
        run: cd packages && pnpm audit --audit-level=high
