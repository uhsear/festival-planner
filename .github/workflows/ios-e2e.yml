name: iOS E2E

# Free (public-repo macOS minutes), EAS-credit-free iOS end-to-end smoke.
#
# Mirrors android-e2e.yml: builds a *local Release .app* for the iOS Simulator on
# the runner (no EAS build) and drives it with Maestro 2.6.0 — the same harness
# used for Android. A Release simulator build embeds the Hermes JS bundle so it's
# self-contained (a Debug build would need a Metro dev server CI doesn't have) and
# installs without code signing.
#
# Manual-only by design (it's a ~20-25min build+sim job; we don't want it on every
# push). Run it from the Actions tab, or:
#   gh workflow run ios-e2e.yml --ref <branch>
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPO_NO_TELEMETRY: '1'
  # Release simulator builds shouldn't upload to Sentry from CI; keep the plugin quiet.
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

permissions:
  contents: read
  # Required by dorny/test-reporter to post JUnit check annotations on the run.
  checks: write
  actions: read

jobs:
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # Expo SDK 56's precompiled XCFrameworks ship a Package.swift declaring
      # `swift-tools-version: 6.2`, which xcodebuild can only resolve with a
      # Swift 6.2 toolchain. The macos-15 image's DEFAULT Xcode is 16.4 (Swift
      # 6.1) and fails SPM resolution ("package 'apple' is using Swift tools
      # version 6.2.0 but the installed version is 6.1.0"). Select the newest
      # Xcode the image has installed (16.x/26 ships Swift 6.2) before building.
      - name: Select newest installed Xcode (need Swift >= 6.2)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sort -t_ -k2 -V | tail -1)
          if [ -z "$NEWEST" ]; then
            NEWEST=/Applications/Xcode.app
          fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Require smoke-test credentials
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          test -n "$TEST_USERNAME" || { echo "::error::TEST_USERNAME is not configured"; exit 1; }
          test -n "$TEST_PASSWORD" || { echo "::error::TEST_PASSWORD is not configured"; exit 1; }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
          run_install: false

      # ── Caches ───────────────────────────────────────────────────────────────
      # ios/ is generated by prebuild (gitignored), so Podfile.lock doesn't exist
      # at checkout. Key on the pnpm lockfile + app.json (the two inputs that
      # control what pod versions prebuild will write into Podfile.lock) so the
      # cache is busted on any relevant dependency change. restore-keys falls
      # back to the most recent same-OS pod cache on a key miss.
      - name: Get pnpm store path
        id: pnpm-store-path
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store-path.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache CocoaPods
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('packages/pnpm-lock.yaml', 'packages/mobile/app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install workspace deps (pnpm)
        working-directory: packages
        run: pnpm install --frozen-lockfile

      # Boot the simulator BEFORE the long native build so it's warm and ready by
      # the time the .app is built. macos-15 is Apple Silicon (M-series), Xcode 16+.
      # No UDID pinning (macos-15 had a device-matching regression) — match by model.
      # NOTE: v5 is the action's latest release and still targets node20; that
      # deprecation warning is upstream (FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 keeps
      # it running). os_version >=18.5 narrows the match — >=17.0 matched 5
      # devices and warned about the ambiguity.
      - name: Boot iOS Simulator
        id: sim
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: 'iPhone 16 Pro'
          os: 'iOS'
          os_version: '>=18.5'
          wait_for_boot: true
          boot_timeout_seconds: 180
          boot_retries: 3

      # Generate the native ios/ project (CNG; ios/ is gitignored).
      # --no-install: pnpm already installed node_modules; don't let prebuild shell
      # out to npm and fight the pnpm layout. CocoaPods is installed separately below.
      - name: Expo prebuild (ios)
        working-directory: packages/mobile
        run: pnpm exec expo prebuild --platform ios --no-install

      # Prebuild may emit a Gemfile (bundler-managed CocoaPods). If it did, use the
      # pinned `bundle exec pod`; otherwise fall back to the system `pod`.
      - name: CocoaPods install
        working-directory: packages/mobile/ios
        run: |
          if [ -f ../Gemfile ]; then
            (cd .. && bundle install)
            bundle exec --gemfile=../Gemfile pod install
          elif [ -f Gemfile ]; then
            bundle install
            bundle exec pod install
          else
            pod install
          fi

      # Discover the workspace + scheme dynamically rather than hardcoding "Festie"
      # (the Expo scheme/workspace name can change between SDK templates).
      - name: Detect workspace and scheme
        id: xcode
        working-directory: packages/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace found in packages/mobile/ios after pod install."
            exit 1
          fi
          # The workspace bundles the app scheme PLUS Pod-provided helper schemes
          # (Pods, and — because expo-dev-client is a dep — EASClient). Building
          # EASClient is wrong: it's the dev-launcher helper, not the app, and it
          # fails the ExpoModulesJSI xcframework script phase. Prefer the scheme
          # named after the workspace (the app target Expo generates), then fall
          # back to the first scheme that is not a known helper.
          WS_NAME="${WORKSPACE%.xcworkspace}"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | WS_NAME="$WS_NAME" python3 -c "import sys,json,os; ss=json.load(sys.stdin)['workspace']['schemes']; ws=os.environ['WS_NAME']; h={'Pods','EASClient'}; print(ws if ws in ss else next((s for s in ss if s not in h), ''))")
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine a build scheme from xcodebuild -list."
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      # Release build targeting the simulator SDK — no code signing required.
      # arm64 only (Apple Silicon runner) cuts ~40% off the compile vs a fat binary.
      # Tee the full log to a file so it can be uploaded as an artifact on failure.
      - name: Build .app for the simulator
        working-directory: packages/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -sdk iphonesimulator \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      # Locate the built .app and fail loudly with a clear message if it's missing.
      - name: Locate built .app
        working-directory: packages/mobile/ios
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under packages/mobile/ios/build/Build/Products — the xcodebuild step did not produce a simulator app. Check xcodebuild.log."
            exit 1
          fi
          echo "APP_PATH=$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")" >> "$GITHUB_ENV"
          echo "Found app: $APP_PATH"

      - name: Install .app into the booted simulator
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.6.1
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke (iOS)
        working-directory: packages/mobile
        env:
          # Passed to Maestro so the authed phase of the smoke runs; CI provides
          # them from repo secrets.
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # On the FIRST run against a fresh sim, Maestro has to build + install
          # its xcuitest XCTest runner before the flow starts; the default driver
          # startup window is too short on a cold macOS runner and throws
          # IOSDriverTimeoutException ("iOS driver not ready in time"). Give it a
          # generous window (240s) and retry once — the runner is installed by the
          # first (failed) attempt, so the retry starts instantly.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          set -o pipefail
          run_maestro() {
            MAESTRO_CLI_NO_ANALYTICS=1 maestro test \
              -e TEST_USERNAME="$TEST_USERNAME" \
              -e TEST_PASSWORD="$TEST_PASSWORD" \
              --test-output-dir="$PWD/maestro-ios-debug" \
              --debug-output="$PWD/maestro-ios-debug" \
              --flatten-debug-output \
              --format junit \
              --output maestro-ios-report.xml \
              .maestro/ios-smoke.yaml
          }
          if ! run_maestro 2>&1 | tee maestro-ios.log; then
            if grep -Eq 'IOSDriverTimeoutException|iOS driver not ready' maestro-ios.log; then
              echo "::warning::Cold iOS driver startup failed; retrying once."
              sleep 10
              run_maestro 2>&1 | tee -a maestro-ios.log
            else
              exit 1
            fi
          fi

      - name: Verify route screenshot coverage
        working-directory: packages/mobile
        run: |
          SCREENSHOT_DIR=maestro-ios-debug/screenshots
          COUNT=$(find "$SCREENSHOT_DIR" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l | tr -d ' ')
          UNIQUE=$(find "$SCREENSHOT_DIR" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' -exec shasum -a 256 {} \; | awk '{print $1}' | sort -u | wc -l | tr -d ' ')
          echo "screenshots=$COUNT unique=$UNIQUE"
          test "$COUNT" -ge 21 || { echo "::error::Expected at least 21 route screenshots"; exit 1; }
          test "$UNIQUE" -ge 15 || { echo "::error::Screenshots are not diverse enough; navigation likely stalled"; exit 1; }

      # Maestro records every -e value in commands-*.json and maestro.log.
      # Keep only screenshots in the debug tree so Actions artifacts can never
      # publish the smoke credentials from this public repository.
      - name: Remove credential-bearing Maestro metadata
        if: always()
        working-directory: packages/mobile
        run: |
          if [ -d maestro-ios-debug ]; then
            find maestro-ios-debug -type f ! -path '*/screenshots/*.png' -delete
          fi

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-maestro-results
          path: |
            packages/mobile/*.png
            packages/mobile/maestro-ios-report.xml
            packages/mobile/maestro-ios-debug/**
            !packages/mobile/maestro-ios-debug/commands-*.json
            !packages/mobile/maestro-ios-debug/maestro.log
          if-no-files-found: error

      # Publish the Maestro JUnit report as a PR/run check annotation so failures
      # surface inline. if: always() + continue-on-error: true ensures this step
      # never fails the gate — it is purely informational trend tracking.
      - name: Publish Maestro test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: iOS Maestro Results
          path: packages/mobile/maestro-ios-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
