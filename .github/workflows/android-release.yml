name: Android Release (AAB)

# Build (and optionally submit) a signed Android **production AAB** on free
# GitHub-hosted runners — replacing `eas build -p android`. Public-repo CI is
# free, so this removes our EAS build-credit dependency entirely.
#
# How it works:
#   1. pnpm install + `expo prebuild` regenerates the gitignored android/ project.
#   2. The withAndroidUploadSigning config plugin (registered in app.json) has
#      injected a `release` signingConfig into app/build.gradle that reads the
#      MYAPP_UPLOAD_* gradle properties we write below.
#   3. We decode the upload keystore from a secret and write those properties.
#   4. gradlew bundleRelease produces a signed .aab (ALL ABIs — real release).
#   5. The AAB is uploaded as a workflow artifact; if input `submit` is true it's
#      pushed to Google Play (status: draft) on the chosen track.
#
# Play App Signing is enabled, so this AAB is signed with the *upload* key only;
# Google re-signs with the real app-signing key on their side. The upload key
# never rotates, so ANDROID_KEYSTORE_BASE64 is a long-lived secret.
#
# Manual-only (it's a 35-55min all-ABI release build). Run from the Actions tab or:
#   gh workflow run android-release.yml --ref <branch> -f submit=false
#
# One-time setup (secrets, keystore export, versionCode offset) is documented in
# packages/mobile/.github-android-release-SETUP.md — READ IT before first run.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit the built AAB to Google Play (draft) after building?'
        type: boolean
        default: false
      track:
        description: 'Google Play track to submit to (only used when submit=true).'
        type: string
        default: internal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPO_NO_TELEMETRY: '1'
  # Activates the withAndroidUploadSigning config plugin during prebuild (it is a
  # no-op everywhere else — EAS builds, android-e2e, local — so their signing is
  # untouched). Required for this workflow to sign the release AAB with the upload key.
  ANDROID_GH_SIGNING: '1'

  # ----------------------------------------------------------------------------
  # versionCode offset. Android requires every uploaded AAB to have a strictly
  # increasing integer versionCode. EAS was auto-incrementing it remotely, so the
  # last EAS-published build has some versionCode N. github.run_number starts low
  # and is unrelated to N, so we add this offset to keep our codes ABOVE the last
  # EAS one and monotonically increasing per run.
  #
  # ACTION REQUIRED (user): look up the last published versionCode in Play Console
  # (Release > Production/Internal > App bundle explorer) and set this to a value
  # strictly greater than (last EAS versionCode - current github.run_number) so
  # the very first GH build already exceeds it. A safe choice: set the offset to
  # (last EAS versionCode + 100). E.g. last EAS code 42 -> set 142 here.
  # The exact lookup steps are a checklist in docs/runbooks/deploy.md (P18).
  VERSION_CODE_OFFSET: '100'

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pnpm-setup

      # Expo SDK 56 / RN 0.85 build with AGP 8 -> JDK 17.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle`: android/ is gitignored and only generated by the
          # prebuild step below, so there are no *.gradle files at checkout for
          # setup-java to key a cache on (it hard-fails).

      - name: Install workspace deps (pnpm)
        working-directory: packages
        run: pnpm install --frozen-lockfile

      - name: Expo Doctor (fail-fast config check)
        working-directory: packages/mobile
        run: npx expo-doctor@latest

      # Generate the native android/ project (CNG; android/ is gitignored).
      # --no-install: pnpm already installed node_modules; don't let prebuild
      # shell out to npm and fight the pnpm layout. The withAndroidUploadSigning
      # config plugin runs here and injects the release signingConfig.
      - name: Expo prebuild (android)
        working-directory: packages/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # The New-Arch release build exhausts Expo's default Gradle Metaspace and
      # dies with OutOfMemoryError: Metaspace. The properties file's last value
      # wins, so appending overrides it. Runner has ~7GB; leave room for the
      # native (clang/CMake) compilers that run outside the JVM.
      - name: Raise Gradle JVM memory
        working-directory: packages/mobile/android
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8\n' >> gradle.properties

      # Decode the upload keystore and wire the four MYAPP_UPLOAD_* properties the
      # withAndroidUploadSigning plugin reads. storeFile is resolved relative to
      # android/app (the module dir), so we drop the keystore there and reference
      # it by bare filename.
      - name: Configure release signing
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty — release would be signed with the debug key. Aborting. See packages/mobile/.github-android-release-SETUP.md"
            exit 1
          fi
          # Keep ONLY base64 alphabet chars before decoding. GNU `base64 -d`
          # rejects any stray byte, and a secret set via a Windows/PowerShell pipe
          # can carry a UTF-8 BOM, CRLF, or even UTF-16 null-byte widening. Filtering
          # to [A-Za-z0-9+/=] strips all of that and recovers the true payload
          # (verified round-trip) regardless of how the secret was encoded.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > app/upload.keystore
          # Fail fast (seconds) if the decoded keystore is corrupt or the store
          # password / alias is wrong — otherwise gradle only discovers it ~45min
          # into the bundle build.
          if ! keytool -list -keystore app/upload.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Decoded keystore failed to open with the provided alias/password — check the ANDROID_* secrets."
            exit 1
          fi
          echo "Keystore decoded and verified (alias present, store password OK)."
          {
            echo ""
            echo "MYAPP_UPLOAD_STORE_FILE=upload.keystore"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> gradle.properties

      # Pin versionCode deterministically: offset (above) + run_number. Strictly
      # increasing per run and above the last EAS-published code (see env above).
      - name: Set versionCode
        working-directory: packages/mobile/android
        run: |
          VERSION_CODE=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          echo "Setting versionCode=$VERSION_CODE (offset=$VERSION_CODE_OFFSET + run_number=$GITHUB_RUN_NUMBER)"
          # The Expo template sources versionCode from app/build.gradle's `defaultConfig`.
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          grep -n "versionCode" app/build.gradle || true

      # Build the signed release AAB for ALL ABIs (a real Play release ships
      # arm64-v8a/armeabi-v7a/x86/x86_64). This is the slow step (~35-55min).
      #
      # SENTRY_AUTH_TOKEN (optional secret): when set, the Sentry Gradle plugin
      # uploads JS source maps + native symbols so production crashes symbolicate.
      # When absent we set SENTRY_DISABLE_AUTO_UPLOAD=true so the plugin doesn't
      # fail the build trying to auth — the AAB still builds, just without uploaded
      # symbols (you can upload them later with sentry-cli).
      - name: Build signed release AAB (all ABIs)
        working-directory: packages/mobile/android
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB exists
        working-directory: packages/mobile/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::Expected AAB not found at $AAB"; ls -R app/build/outputs/bundle || true; exit 1
          fi
          echo "AAB_PATH=packages/mobile/android/$AAB" >> "$GITHUB_ENV"
          ls -l "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: festie-release-aab-${{ env.VERSION_CODE }}
          path: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Gated on the `submit` input. Pushes the AAB to Google Play as a DRAFT on
      # the chosen track (default internal) — matching the old `eas submit`
      # behaviour (track internal, releaseStatus draft).
      - name: Submit to Google Play (draft)
        if: ${{ inputs.submit }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: us.festie.app
          releaseFiles: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft
