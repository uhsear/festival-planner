version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (and patched). Actions are pinned
  # to full commit SHAs in .github/workflows/* for supply-chain safety; Dependabot
  # bumps those SHAs (preserving the `# vX` tag comment) so pinning doesn't mean
  # going stale on security fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Application dependencies. Until 2026-08-18 this file covered ONLY
  # github-actions, so npm/pnpm bumps happened solely when someone remembered —
  # there was no automated flow for the runtime dependencies at all.
  # Note: pnpm workspaces are declared under the `npm` ecosystem (Dependabot has
  # no separate `pnpm` value). Groups are deliberately broad so the weekly PR
  # count stays reviewable for a solo maintainer; security bumps still arrive
  # individually and are not suppressed by grouping.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    ignore:
      # typescript 7 is a hard block, not a preference: `npm run lint` fails with
      # "typescript-eslint does not support TS 7.0" (typescript-eslint 8.70.0
      # still peers on typescript >=4.8.4 <6.1.0, and no release widens it yet),
      # and the `gen:api-types` CI gate throws
      # "Cannot read properties of undefined (reading 'createKeywordTypeNode')"
      # because TS 7's root export is only lib/version.cjs — the JS compiler API
      # moved to typescript/unstable/ast/*, which openapi-typescript does not use.
      # Unblocked when BOTH are true: typescript-eslint ships a peer range that
      # covers 7.x, and scripts/gen-api-types.mjs no longer depends on a package
      # that imports the removed root compiler API. Majors only — patch and minor
      # updates to typescript must keep flowing.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      backend-prod:
        dependency-type: production
        patterns:
          - "*"
      backend-dev:
        dependency-type: development
        patterns:
          - "*"

  # Point at the pnpm WORKSPACE ROOT, not the three member directories.
  #
  # Listing the members produced pull requests that could never pass CI. pnpm-lock.yaml
  # lives here at /packages, so a member-scoped update changed packages/*/package.json
  # and left the lockfile alone. Every job then failed identically on
  # `pnpm install --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE, before running a
  # single check — so a grouped workspace bump got zero CI signal and had to be
  # re-applied by hand. From the root, Dependabot resolves the members through
  # pnpm-workspace.yaml and updates the lockfile in the same commit.
  - package-ecosystem: npm
    directory: /packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    ignore:
      # Expo pins the versions of its own SDK packages; bump these via
      # `expo install --check` during a deliberate SDK upgrade, never piecemeal.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "@expo/*"
      # typescript 7 — same hard block as the root project above, for the same
      # two reasons (typescript-eslint's peer range, and the gen:api-types gate
      # that TS 7's slimmed root export breaks). All three workspace members are
      # pinned to the 6.x line together, so the major has to move as one change
      # once both blockers clear. Majors only; patch and minor keep flowing.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      workspace-prod:
        dependency-type: production
        patterns:
          - "*"
      workspace-dev:
        dependency-type: development
        patterns:
          - "*"
