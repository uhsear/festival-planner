name: pnpm setup
description: >-
  Set up Node and pnpm and restore the pnpm store cache for jobs that build the
  packages/ workspace. Checkout is intentionally NOT included — callers must run
  actions/checkout before this action.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version to install (matches the workspace toolchain).
    required: false
    default: '9'
  node-cache:
    description: >-
      setup-node built-in cache. Set to 'npm' for jobs that also run `npm ci`
      against the root npm project; leave empty otherwise.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.node-cache }}
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
    - name: Get pnpm store directory
      shell: bash
      run: |
        # Query from packages/ (the real workspace); the root pnpm-workspace.yaml
        # has no `packages:` field, so `pnpm store path` errors there. Swallow any
        # error and fall back to the default store dir so the cache always has a path.
        STORE_PATH="$(cd packages && pnpm store path --silent 2>/dev/null || true)"
        if [ -z "$STORE_PATH" ]; then STORE_PATH="$HOME/.local/share/pnpm/store"; fi
        echo "STORE_PATH=$STORE_PATH" >> "$GITHUB_ENV"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
