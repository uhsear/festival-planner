# Logrotate configuration for Festie application logs
# Install: sudo cp logrotate.d/festie.conf /etc/logrotate.d/festie
# Test:    sudo logrotate -d /etc/logrotate.d/festie  (dry run)
# Force:   sudo logrotate -f /etc/logrotate.d/festie

# PM2 application logs (stdout + stderr)
/opt/festie/logs/pm2-out.log
/opt/festie/logs/pm2-error.log
{
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 50M
    dateext
    dateformat -%Y%m%d
}

# Cron job logs (health checks, alerts, backups)
/opt/festie/logs/health-check.log
/opt/festie/logs/health-alerts.log
/opt/festie/logs/alert.log
/opt/festie/logs/cron-health.log
/opt/festie/logs/cron-errors.log
/opt/festie/logs/backup.log
/opt/festie/logs/backup-offsite.log
/opt/festie/logs/audit-log-cleanup.log
/opt/festie/logs/log-cleanup.log
{
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 20M
    dateext
    dateformat -%Y%m%d
}
