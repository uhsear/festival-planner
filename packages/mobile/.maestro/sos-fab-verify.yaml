# SOS-FAB regression guard (Android New-Architecture 0x0-collapse bug).
#
# The raise-SOS FAB on /find (find-sos-fab) and /map (map-sos-fab) is an
# absolutely-positioned child pinned bottom-right. Under RN 0.85 New Arch an
# absolute child of a relative-flow parent collapsed to 0x0 and the FAB went
# invisible on Android (fine on iOS via shadow*). Fix: outer absolute wrapper +
# elevation. This flow proves both FABs actually render on Android.
#
# AUTHED-ONLY: needs TEST_USERNAME/TEST_PASSWORD via -e (CI repo secrets) AND a
# crew membership (the FAB screens require an active crew). Run on the rig:
#   maestro --device emulator-5554 test .maestro/sos-fab-verify.yaml \
#     -e TEST_USERNAME=<u> -e TEST_PASSWORD=<p>
# Deep-links past the nav with the `festie` scheme; the two assertVisible on the
# FAB testIDs are the hard gates.
appId: us.festie.app
env:
  TEST_USERNAME: ${TEST_USERNAME}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Skip|Build your festival|Select a Festival|Festie"
    timeout: 120000
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Schedule"
    optional: true
- runFlow:
    when:
      visible: "Select a Festival"
    commands:
      - tapOn:
          id: "festival-card-nc-2026"
      - extendedWaitUntil:
          visible:
            text: "Switch|Timeline|Cards"
          timeout: 90000
- tapOn:
    text: "Account"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# Authed-only: the whole FAB check is gated on the login form appearing.
- runFlow:
    when:
      visible: "Username"
    commands:
      - tapOn: "Username"
      - inputText: "${TEST_USERNAME}"
      - hideKeyboard
      - tapOn: "Password"
      - inputText: "${TEST_PASSWORD}"
      - hideKeyboard
      - tapOn: "Sign in"
      - tapOn:
          text: "Not Now"
          optional: true
      - extendedWaitUntil:
          notVisible: "Username"
          timeout: 25000
      # ── /find FAB ──
      - openLink: festie:///find
      - extendedWaitUntil:
          visible: "Find each other"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: sosfab-01-find
      - assertVisible:
          id: "find-sos-fab"
      # ── /map FAB ──
      - tapOn:
          id: "find-action-map"
      - extendedWaitUntil:
          visible:
            id: "map-sos-fab"
          timeout: 25000
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: sosfab-02-map
      - assertVisible:
          id: "map-sos-fab"
