# Android UI smoke for CI (local Gradle release APK on a KVM emulator via
# reactivecircus/android-emulator-runner — no EAS credit). Standalone build
# (appId us.festie.app) hitting prod https://festie.us/api/v1.
#
# Two phases:
#  1. GUEST (always runs, secret-free): launch -> onboarding -> picker -> schedule
#     views -> tabs. Proves the build launches/renders/navigates.
#  2. AUTHED (guarded — runs only when TEST_USERNAME/TEST_PASSWORD are passed via
#     -e; CI provides them from repo secrets): login -> crew -> assert the
#     Live-Location control + SOS button render and the SOS confirm dialog appears
#     (it CANCELS — never actually sends an SOS/shares, to avoid prod side effects).
#     Android exposes RN a11y labels reliably, so authed nav works here (unlike the
#     iOS cloud sim). Content taps are optional + screenshotted; final assertVisible
#     on app chrome is the hard gate.
appId: us.festie.app
env:
  TEST_USERNAME: ${TEST_USERNAME}
***REDACTED-CREDENTIAL***
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Skip|Build your festival|Select a Festival|Festie"
    timeout: 120000
- takeScreenshot: 01-launch
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Select a Festival|North Coast|Timeline"
    timeout: 30000
- takeScreenshot: 02-festival-picker
# ── Guest festival selection (HARD gate) ──
# Regression guard for the guest bounce-back bug: a stale persist rehydration
# clobbered currentFestivalId mid-selectFestival, so the schedule rendered for
# ~2s then bounced back to the picker. The tap and BOTH assertions are
# non-optional: select as a guest, confirm the schedule rendered, wait past
# the bounce window, then confirm the picker did NOT come back.
- tapOn:
    text: "Schedule"
    optional: true
- extendedWaitUntil:
    visible:
      text: "North Coast Festival 2026|Select a Festival|Timeline"
    timeout: 30000
- runFlow:
    when:
      visible: "Select a Festival"
    commands:
      - tapOn: "North Coast Festival 2026"
      # Diagnostic: capture whatever rendered right after the tap, BEFORE any
      # assertion, so a failure leaves evidence (spinner vs picker vs schedule).
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 03a-after-tap
      # Schedule must render. 90s: a cold CI emulator fetching a 121-set lineup
      # from prod over the public internet can exceed 30s without being a bug.
      # "Switch" is the SubHeader's switch-festival affordance (proven text in
      # two-festival.yaml); Timeline/Cards are the view-switcher labels.
      - extendedWaitUntil:
          visible:
            text: "Switch|Timeline|Cards"
          timeout: 90000
      - takeScreenshot: 03b-festival-selected
      # …and must STILL be rendered well past the ~2s bounce window.
      - waitForAnimationToEnd:
          timeout: 6000
      - assertNotVisible: "Select a Festival"
      - assertVisible:
          text: "Switch|Timeline|Cards"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 03-timeline
- tapOn:
    text: "Grid"
    optional: true
- takeScreenshot: 04-grid
- tapOn:
    text: "Cards"
    optional: true
- takeScreenshot: 05-cards
# Scroll the Cards page — chrome now rides in the list header, so the whole page
# should scroll as one and reveal more cards (not just a tiny window).
- scroll
- scroll
- takeScreenshot: 05a-cards-scrolled
# Bounce-back gate, part 2: we are now 10s+ past the guest festival selection.
# If the selection silently unwound to the picker (the rehydration-clobber
# regression), this fails the flow loudly instead of the walk continuing.
- assertNotVisible: "Select a Festival"
# ── Tab-bar interactivity gate (NON-optional, always runs) ──
# Regression guard for the build-#15 bug where the Schedule body's timeline
# carousel sized to its content, overflowed the frame, and painted/intercepted
# touches over the bottom tab bar — leaving every tab untappable. These taps are
# deliberately NOT optional and each asserts the destination rendered, so a dead
# tab bar fails the flow instead of silently passing the chrome check below.
- tapOn:
    text: "Picks"
- assertVisible: "My Picks"
- tapOn:
    text: "Schedule"
- assertVisible:
    text: "North Coast Festival 2026|Select a Festival|Timeline|Cards"
# ── Guarded login (runs only when creds are passed) ──
- tapOn:
    text: "Account"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Username"
    commands:
      - tapOn: "Username"
      - inputText: "${TEST_USERNAME}"
      - hideKeyboard
***REDACTED-CREDENTIAL***
***REDACTED-CREDENTIAL***
      - hideKeyboard
      - tapOn: "Sign in"
      - tapOn:
          text: "Not Now"
          optional: true
      - extendedWaitUntil:
          notVisible: "Username"
          timeout: 25000
- takeScreenshot: 06-account
# ── Crew + Live Location + SOS (authed; best-effort, needs the account in a crew) ──
- tapOn:
    text: "Crew"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 07-crew
# Crew sub-tabs (Members/Plan/Logistics/Money). Screenshot each to verify the
# segmented bar + pane controls keep their size (no oversized control on the
# shorter Plan/Logistics panes) and rows don't overlap the bar.
- tapOn:
    id: "crew-tab-plan"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 07a-crew-plan
- tapOn:
    id: "crew-tab-money"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 07b-crew-money
- tapOn:
    id: "crew-tab-logistics"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 07c-crew-logistics
# Live location + SOS live in the Logistics tab (now selected above).
- scrollUntilVisible:
    element:
      text: "Share my live location"
    direction: DOWN
    timeout: 12000
    optional: true
- takeScreenshot: 08-live-location
- scrollUntilVisible:
    element:
      text: "Send SOS"
    direction: DOWN
    timeout: 8000
    optional: true
- takeScreenshot: 09-sos
# Open the SOS confirm dialog to prove it guards, then CANCEL (never send).
- tapOn:
    text: "Send SOS"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 10-sos-confirm-dialog
- tapOn:
    text: "Cancel"
    optional: true
# ── Remaining tabs ──
- tapOn:
    text: "Picks"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 11-picks
- tapOn:
    text: "Account"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 12-account
# Hard gate: app chrome present (no crash through the whole walk)
- assertVisible:
    text: "Timeline|Picks|Crew|Account|Festie"
