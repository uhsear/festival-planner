# iOS Simulator SMOKE for the ios-e2e GitHub Actions gate (Maestro 2.6.0 on a
# macos-15 runner; standalone Release .app installed in the booted sim, pointed
# at prod https://festie.us/api/v1). Cross-platform selectors only — visible text
# and accessibility labels / testIDs, never coordinates.
#
# Two phases, mirroring the proven .maestro/android-smoke.yaml + the documented
# iOS a11y lesson:
#  1. GUEST (HARD gate, secret-free): launch -> dismiss onboarding -> picker ->
#     select North Coast as a guest BY testID -> schedule renders -> view switch.
#     iOS New-Arch exposes a festival card as ONE combined a11y node, so the card
#     is tapped by testID (festival-card-nc-2026), never by inner name text, and
#     the schedule is asserted via the view-switcher / Switch chrome that renders
#     as standalone Text. This is the gate for this job.
#  2. AUTHED (GUARDED / best-effort): the iOS Simulator + Maestro can't reliably
#     find the RN login TextInput, so login is wrapped in a `when: visible:
#     Username` guard — if the field can't be found the block SKIPS and the smoke
#     still passes at the guest level. Full authed coverage runs on the Android
#     Maestro job (identical RN code) and on the real TestFlight device.
#
# appId is the iOS bundleIdentifier from app.json.
appId: us.festie.app
env:
  TEST_USERNAME: ${TEST_USERNAME}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# ── Launch on a clean slate ──
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Skip|Your festival|Build your festival|Select a Festival|North Coast|Timeline|Festie"
    timeout: 120000
- takeScreenshot: 01-launch

# ── Dismiss the first-run onboarding carousel ──
# The Skip control's iOS a11y node is its accessibilityLabel ("Skip intro"), not
# the inner "Skip" Text, so match by regex to hit either. Tap until the picker
# (or an already-selected schedule) is reached.
- runFlow:
    when:
      visible: "Skip.*"
    commands:
      - tapOn:
          text: "Skip.*"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      text: "Select a Festival|North Coast|Switch|Timeline|Cards"
    timeout: 30000
- takeScreenshot: 02-festival-picker

# ── Guest-browse the schedule (HARD gate) ──
# If the picker is showing, select North Coast as a guest BY testID (the whole
# TouchableOpacity; the inner name Text isn't separately exposed on iOS New-Arch)
# and confirm the schedule renders. "Switch"/"Timeline"/"Cards" are the proven
# standalone-Text chrome from two-festival.yaml / android-smoke.yaml.
- runFlow:
    when:
      visible: "Select a Festival"
    commands:
      - tapOn:
          id: "festival-card-nc-2026"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 03a-after-tap
      # 90s: a cold sim fetching the 121-set lineup from prod over the public
      # internet can exceed 30s without being a bug.
      - extendedWaitUntil:
          visible:
            text: "Cards|My picks|Now & Next|NOW|Crew"
          timeout: 90000
      - waitForAnimationToEnd:
          timeout: 4000
      - assertNotVisible: "Select a Festival"
# Schedule chrome that renders as standalone Text on iOS (proven in 03-schedule
# screenshot): the Cards view-switcher label, the "My picks"/"Crew"/"Now & Next"
# action cluster, and the "NOW" indicator.
- assertVisible:
    text: "Cards|My picks|Now & Next|NOW|Crew"
- takeScreenshot: 03-schedule-guest

# ── Schedule view switcher ──
- tapOn:
    text: "Grid"
    optional: true
- takeScreenshot: 04-grid
- tapOn:
    text: "Cards"
    optional: true
- takeScreenshot: 05-cards

# ── Tab navigation (NativeTabs render their Labels as native tab items on iOS;
# Maestro taps them by label text). Best-effort taps with screenshots; the hard
# chrome gate is at the end. ──
- tapOn:
    text: "Picks"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 06-picks

# ── Login via the Account tab (GUARDED / best-effort on iOS) ──
- tapOn:
    text: "Account"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-account
- runFlow:
    when:
      visible: "Username"
    commands:
      - tapOn: "Username"
      - inputText: "${TEST_USERNAME}"
      # No `hideKeyboard`: it throws on the iOS Simulator ("Couldn't hide the
      # keyboard…") and fails the flow. Tapping the Password field dismisses the
      # Username keyboard naturally; the large "Sign in" button sits below the
      # fields and is tappable with the keyboard up, so it isn't needed.
      - tapOn: "Password"
      - inputText: "${TEST_PASSWORD}"
      - tapOn: "Sign in"
      - tapOn:
          text: "Not Now"
          optional: true
      - extendedWaitUntil:
          notVisible: "Username"
          timeout: 25000
      - takeScreenshot: 08-logged-in

# ── Back to the schedule and confirm it still renders ──
- tapOn:
    text: "Schedule"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 09-schedule
- assertNotVisible: "Select a Festival"

# ── Hard gate: app chrome present (no crash through the whole walk) ──
- assertVisible:
    text: "Schedule|Picks|Crew|Account|Cards|My picks|Now & Next|NOW|Festie"
