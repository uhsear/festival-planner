appId: host.exp.exponent
---
# Reusable login subflow. Assumes Expo Go is already showing the Festie app.
# No-op if a session is already authenticated (login screen not visible).
- runFlow:
    when:
      visible: "Sign in to your account"
    commands:
      - tapOn: "Username"
      - inputText: ${TEST_USERNAME}
      - tapOn: "Password"
      - inputText: ${TEST_PASSWORD}
      - hideKeyboard
      - tapOn: "Sign In"
      - extendedWaitUntil:
          notVisible: "Sign in to your account"
          timeout: 30000
