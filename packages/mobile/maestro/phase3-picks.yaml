appId: host.exp.exponent
env:
  PROJECT_URL: exp://e0rp0ks-uhsear-8081.exp.direct
  FESTIVAL: "Forbidden Kingdom 2026"
---
# Phase 3 (Picks) render-safety check: cards render with the new useSetStatus
# hook + LiveBadge + note indicator without crashing.
- launchApp
- openLink: ${PROJECT_URL}
- extendedWaitUntil:
    visible: "Festie"
    timeout: 120000
- runFlow: login.yaml
- runFlow:
    when:
      visible: "${FESTIVAL}"
    commands:
      - tapOn: "${FESTIVAL}"
# Cards view (Timeline tab) renders every SetCardMobile.
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 30000
- tapOn: "Timeline"
- tapOn: "Cards"
- takeScreenshot: p3-cards
# Picks tab.
- tapOn: "Picks"
- takeScreenshot: p3-picks
