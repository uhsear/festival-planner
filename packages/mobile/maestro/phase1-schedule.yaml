appId: host.exp.exponent
env:
  PROJECT_URL: exp://e0rp0ks-uhsear-8081.exp.direct
  FESTIVAL: "Forbidden Kingdom 2026"
---
# Phase 1 (Schedule) verification: Timeline / Grid / Cards views render.
- launchApp
- openLink: ${PROJECT_URL}
- extendedWaitUntil:
    visible: "Festie"
    timeout: 120000
- runFlow: login.yaml

# Pick a festival if the selector is showing.
- runFlow:
    when:
      visible: "${FESTIVAL}"
    commands:
      - tapOn: "${FESTIVAL}"

# Timeline view
- tapOn: "Timeline"
- takeScreenshot: p1-timeline
# Grid view
- tapOn: "Grid"
- takeScreenshot: p1-grid
# Cards view
- tapOn: "Cards"
- takeScreenshot: p1-cards
