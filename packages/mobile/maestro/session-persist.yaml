appId: us.festie.app
env:
  FESTIVAL: "Forbidden Kingdom 2026"
---
# Verifies login survives an app restart (the fix). Log in fresh, force-stop,
# relaunch WITHOUT clearing state, and confirm we're still signed in.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 90000
- tapOn: "Username"
- inputText: "asir"
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    notVisible: "Sign in to your account"
    timeout: 30000
- runFlow:
    when:
      visible: "${FESTIVAL}"
    commands:
      - tapOn: "${FESTIVAL}"
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 30000
- takeScreenshot: sp1-logged-in

# Cold restart (force-stop + relaunch, no clearState).
- stopApp
- launchApp
# If the fix works, the persisted token is restored and we land in the tabs —
# NOT the login screen.
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 60000
- assertNotVisible: "Sign in to your account"
- takeScreenshot: sp2-after-restart
