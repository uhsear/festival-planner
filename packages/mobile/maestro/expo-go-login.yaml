appId: host.exp.exponent
---
# Login verification against the app running inside Expo Go (not a standalone
# build). Assumes Expo Go was just relaunched so the unauthenticated app boots
# to the Sign in screen; authenticates and confirms the authenticated UI shows.
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 60000
- tapOn: "Username"
- inputText: "asir"
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- takeScreenshot: eg-login-filled
- tapOn: "Sign In"
- extendedWaitUntil:
    notVisible: "Sign in to your account"
    timeout: 30000
- takeScreenshot: eg-after-login
