appId: us.festie.app
---
# Boot smoke: the standalone APK launches and reaches the login screen (points
# at prod). Confirms the build runs with OTA config + socket fixes + Sentry
# package present (plugin removed) — no native crash on launch.
# Dismiss any lingering system overlay (e.g. an expanded notification shade).
- pressKey: Back
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 60000
- takeScreenshot: boot-ok
