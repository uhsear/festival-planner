appId: host.exp.exponent
env:
  PROJECT_URL: exp://e0rp0ks-uhsear-8081.exp.direct
  FESTIVAL: "Forbidden Kingdom 2026"
---
# Phase 7 helper: load the current bundle (with OfflineBanner) and sign in so
# the app is running + online. The offline toggle + capture is done via adb
# afterwards (a reload while offline couldn't fetch the dev bundle).
- pressKey: Back
- launchApp
- openLink: ${PROJECT_URL}
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 180000
- runFlow: login.yaml
- runFlow:
    when:
      visible: "${FESTIVAL}"
    commands:
      - tapOn: "${FESTIVAL}"
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 30000
- takeScreenshot: p7-online
