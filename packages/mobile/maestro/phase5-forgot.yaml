appId: host.exp.exponent
env:
  PROJECT_URL: exp://e0rp0ks-uhsear-8081.exp.direct
---
# Phase 5 (Auth) — forgot-password flow. Logs the emulator out first (separate
# from any other device session), exercises forgot-password with a non-existent
# email (backend returns a generic success, so no real reset email is sent),
# then logs back in to leave the emulator authenticated for later phases.
# Dismiss any lingering system overlay (e.g. a share sheet) before launching.
- pressKey: Back
- launchApp
- openLink: ${PROJECT_URL}
- extendedWaitUntil:
    visible: "Festie"
    timeout: 120000

# Ensure logged out: if the Account tab is present we're signed in.
- runFlow:
    when:
      visible: "Account"
    commands:
      - tapOn: "Account"
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: DOWN
          timeout: 20000
      - tapOn: "Sign out of your account"
      - tapOn: "Sign Out"
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 30000

# On the login screen — exercise forgot password.
- assertVisible: "Forgot password?"
- tapOn: "Forgot password?"
- assertVisible: "Reset your password"
- tapOn: "you@example.com"
- inputText: "test-noreply@example.com"
- hideKeyboard
- tapOn: "Send Reset Link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 30000
- takeScreenshot: p5-forgot

# Restore: back to login and sign back in.
- tapOn: "Back to sign in"
- runFlow: login.yaml
