appId: host.exp.exponent
env:
  PROJECT_URL: exp://e0rp0ks-uhsear-8081.exp.direct
  FESTIVAL: "Forbidden Kingdom 2026"
---
# Phase 2 meeting-point edit verification: create -> edit -> delete (self-cleaning).
- launchApp
- openLink: ${PROJECT_URL}
- extendedWaitUntil:
    visible: "Festie"
    timeout: 120000
- runFlow: login.yaml
- runFlow:
    when:
      visible: "${FESTIVAL}"
    commands:
      - tapOn: "${FESTIVAL}"
- extendedWaitUntil:
    visible: "Crew"
    timeout: 30000
- tapOn: "Crew"

# Create a meeting point.
- scrollUntilVisible:
    element:
      text: "Add meeting point"
    direction: DOWN
    timeout: 20000
- tapOn: "Add meeting point"
- scrollUntilVisible:
    element:
      id: "mp-label-input"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "mp-label-input"
- inputText: "MaestroTest"
- tapOn:
    id: "mp-location-input"
- inputText: "Test Spot"
- hideKeyboard
- tapOn: "Add meeting point"
- assertVisible: "MaestroTest"

# Edit it.
- tapOn: "Edit meeting point MaestroTest"
- tapOn:
    id: "mp-label-input"
- eraseText
- inputText: "MaestroEdited"
- hideKeyboard
- tapOn: "Add meeting point"
- assertVisible: "MaestroEdited"
- takeScreenshot: p2-mp-edited

# Delete it (clean up).
- tapOn: "Remove meeting point MaestroEdited"
- tapOn: "Remove"
- assertNotVisible: "MaestroEdited"
