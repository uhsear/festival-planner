packages:
  - "shared"
  - "mobile"
  - "web"

# pnpm v10 blocks dependency build scripts by default. Allow @sentry/cli to run
# its postinstall, which downloads the sentry-cli binary that the
# @sentry/react-native Gradle integration shells out to for release source-map
# upload. Minimal allowlist — everything else stays blocked.
onlyBuiltDependencies:
  - "@sentry/cli"
  - "esbuild"

# Supply-chain hardening (semgrep pnpm ruleset; pnpm >=10.26 supports all three).
# minimumReleaseAge: resolve only versions published >=7 days (10080 min) ago —
# already-locked versions are unaffected; bump security patches past it with
# minimumReleaseAgeExclude if ever needed urgently.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Expo SDK packages ship coordinated patch trains from Expo's own release
# pipeline; expo-doctor demands the exact latest patch, which is often <7 days
# old. Exclude the expo scope from the release-age floor so doctor and the
# supply-chain rule stop fighting.
minimumReleaseAgeExclude:
  - expo
  - "expo-*"
  - "@expo/*"
  - babel-preset-expo
  - jest-expo
# semver@5.7.2 (transitive via @lhci/cli>lighthouse) predates npm provenance;
# a later semver version has attestation, so no-downgrade false-positives on
# the old-but-locked pin. Trusted legacy dev-tool dep — excluded.
trustPolicyExclude:
  - semver

# Audit suppressions. ONLY for advisories where no patched release exists, so a
# version bump cannot clear them and the alternative is deleting a feature.
# Keyed by GHSA id, never by package name, so a future advisory against the same
# package still fails the audit.
# RE-CHECK TRIGGER: drop the image-size entries when image-size publishes >2.0.2,
# and the extract-zip entry when extract-zip publishes >2.0.1. Both were the
# latest published version as of 2026-09-08 and both are inside the vulnerable
# range, so every existing release is affected.
auditConfig:
  ignoreGhsas:
    # image-size ICNS infinite loop (CVE-2025-71330) and JXL/HEIF infinite loops
    # (CVE-2025-71329). Reached only via mobile>expo>@expo/metro>metro, the React
    # Native bundler: it reads dimensions of first-party assets at build time and
    # does not ship in the app binary or parse user input at runtime.
    - "GHSA-w3rx-r6r6-pgpr"
    - "GHSA-5p2g-fcmc-qvqq"
    # extract-zip unvalidated symlink path traversal (CVE-2026-56876). Dev-only,
    # via web>@lhci/cli>lighthouse>puppeteer-core>@puppeteer/browsers, which uses
    # it to unpack the Chrome build it downloads for Lighthouse CI.
    - "GHSA-jmr9-qjv8-65gv"
    # "extract-zip allows arbitrary file writes through symlink archive entries"
    # — GitHub's own summary, quoted because it reads almost identically to the
    # entry above and only the id tells them apart. Same package, same dev-only
    # path, and still no published fix: every release up to and including 2.0.1,
    # the latest, is inside the vulnerable range.
    - "GHSA-7pqw-9j4j-h8q3"
